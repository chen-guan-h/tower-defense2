<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吉依卡哇防衛戰：吉依卡哇 vs 兔子軍團</title>
    <style>
        body {
            background-color: #2c223b;
            color: #ffe6f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: auto;
        }
        h2 {
            margin: 5px 0 10px 0;
            color: #ffb3d9;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #stats {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            background: rgba(255, 182, 193, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
        }
        .controls {
            margin-bottom: 8px;
        }
        .tower-btn {
            color: white;
            padding: 8px 14px;
            margin: 4px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .tower-btn:active {
            transform: scale(0.95);
        }
        canvas {
            background-color: #3d3152;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border-radius: 12px;
            max-width: 100%;
            height: auto;
            border: 4px solid #ff99cc;
        }
        #startWaveBtn {
            background: #ff66b2;
            color: white;
            padding: 10px 24px;
            font-size: 16px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(255,102,178,0.4);
        }
        #startWaveBtn:hover {
            background: #ff3399;
        }
    </style>
</head>
<body>

    <h2>🌸 吉依卡哇防衛戰 🌸</h2>
    <div id="stats">
        討伐點數 (金錢): <span id="money">150</span> | 草包栗子酥生命: <span id="lives">10</span> | 波次: <span id="wave">0/4</span>
    </div>
    
    <div class="controls">
        <button class="tower-btn" data-type="chiikawa" style="background:#ff99cc; color:#333;">吉依卡哇 (討伐棒) $50</button>
        <button class="tower-btn" data-type="hachiware" style="background:#66b3ff;">小八貓 (相機閃光) $100</button>
        <button class="tower-btn" data-type="usagi" style="background:#ffcc00; color:#333;">狂粉吉依卡哇 (呐喊波) $120</button>
    </div>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <div>
        <button id="startWaveBtn">呼叫兔子軍團來襲！</button>
    </div>

    <script>
        const CONFIG = {
            TILE_SIZE: 40,
            MAP_WIDTH: 15,
            MAP_HEIGHT: 10,
            // 防禦塔設定：化身為吉依卡哇主要角色
            TOWERS: {
                chiikawa: { name: '吉依卡哇', cost: 50, range: 120, damage: 18, fireRate: 600, color: '#ff99cc', symbol: 'ちい' },
                hachiware: { name: '小八貓', cost: 100, range: 220, damage: 50, fireRate: 1300, color: '#66b3ff', symbol: 'ハチ' },
                usagi: { name: '強悍吉依', cost: 120, range: 90, damage: 30, fireRate: 800, color: '#ffcc00', symbol: 'つよ', splashRadius: 65 }
            },
            // 敵人設定：化身為瘋狂的兔子軍團與奇美拉
            WAVES: [
                { count: 8, speed: 1.2, hp: 60, reward: 15, interval: 1200, name: '小兔子軍團' },
                { count: 12, speed: 1.5, hp: 100, reward: 20, interval: 1000, name: '狂吼兔子團' },
                { count: 15, speed: 1.8, hp: 160, reward: 25, interval: 800, name: '巨型巨大化兔子' },
                { count: 20, speed: 2.2, hp: 260, reward: 35, interval: 600, name: '終極兔子大軍 (YA-HA!)' }
            ]
        };

        class TowerDefenseGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                
                this.money = 150;
                this.lives = 10;
                this.currentWave = 0;
                this.waveInProgress = false;
                this.selectedTowerType = 'chiikawa';
                
                this.towers = [];
                this.enemies = [];
                this.projectiles = [];
                this.spawnQueue = [];
                this.spawnInterval = 1000;
                this.lastSpawnTime = 0;
                
                // 討伐路徑 (草包栗子酥的家)
                this.path = [
                    { x: 0, y: 2 },
                    { x: 5, y: 2 },
                    { x: 5, y: 7 },
                    { x: 10, y: 7 },
                    { x: 10, y: 3 },
                    { x: 14, y: 3 }
                ].map(p => ({ x: p.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2, y: p.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2 }));
                
                this.initUI();
                this.lastTime = performance.now();
                requestAnimationFrame((t) => this.loop(t));
            }
            
            initUI() {
                document.querySelectorAll('.tower-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.selectedTowerType = e.target.getAttribute('data-type');
                        document.querySelectorAll('.tower-btn').forEach(b => b.style.outline = 'none');
                        e.target.style.outline = '3px solid #ff66b2';
                    });
                });
                
                document.getElementById('startWaveBtn').addEventListener('click', () => {
                    this.startNextWave();
                });
                
                this.canvas.addEventListener('click', (e) => {
                    const rect = this.canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    this.tryBuildTower(x, y, this.selectedTowerType);
                });
            }
            
            updateUI() {
                document.getElementById('money').innerText = this.money;
                document.getElementById('lives').innerText = this.lives;
                document.getElementById('wave').innerText = `${this.currentWave}/${CONFIG.WAVES.length}`;
            }
            
            startNextWave() {
                if (this.waveInProgress || this.currentWave >= CONFIG.WAVES.length) return;
                
                const waveConfig = CONFIG.WAVES[this.currentWave];
                this.currentWave++;
                this.waveInProgress = true;
                this.spawnInterval = waveConfig.interval;
                this.updateUI();
                
                for (let i = 0; i < waveConfig.count; i++) {
                    this.spawnQueue.push({
                        hp: waveConfig.hp,
                        maxHp: waveConfig.hp,
                        speed: waveConfig.speed,
                        reward: waveConfig.reward
                    });
                }
            }
            
            tryBuildTower(pixelX, pixelY, typeName) {
                const gridX = Math.floor(pixelX / CONFIG.TILE_SIZE);
                const gridY = Math.floor(pixelY / CONFIG.TILE_SIZE);
                const towerConfig = CONFIG.TOWERS[typeName];
                
                if (this.money < towerConfig.cost) return;
                
                const existing = this.towers.find(t => t.gridX === gridX && t.gridY === gridY
